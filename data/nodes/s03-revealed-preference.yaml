  - id: strong-axiom-of-revealed-preference
    name: Strong axiom of revealed preference
    kind: axiom
    section: s03-revealed-preference
    topic: revealed-preference
    gist: A revealed preference axiom requiring the transitive closure of direct revealed preference to be acyclic, ensuring demand can be rationalized.
    status: proposed
    provenance:
      driver: agent
      agent: antigravity-gemini
      run: fill-s03
    explanation: |-
      The Strong Axiom of Revealed Preference generalizes pairwise behavioral consistency to multistep choice trajectories.
      Under this condition, whenever a chain of consumer decisions demonstrates that bundle $a$ stands above bundle $b$ through intermediate purchasing acts at which each succeeding option was within budget, bundle $b$ cannot be picked in any scenario where $a$ is feasible.
      Eliminating cycles of any length ensures that the transitive closure of binary revealed comparisons remains strictly acyclic, enabling economists to extend empirical consumer choices into an underlying complete preference ordering.
    citations:
      - source: mwg
        ref: Press_Microeconomic_Theory_2011, §3.J The Strong Axiom of Revealed Preference, p. 102
      - source: rubinstein
        ref: Rubenstein_Lecture_Notes_in_Microeconomic_Theory_2026, §The Weak and Strong Axioms of Revealed Preference, p. 85
      - source: lecture
        ref: '2026-09-10'
      - source: lecture
        ref: '2026-09-15'
    formal: |-
      \text{For distinct bundles } x^1, \dots, x^k \text{ with } x^i = x(p^i, w^i): \\
      \left[ \forall i \in \{1, \dots, k-1\}, \ p^i \cdot x^{i+1} \le w^i \right] \implies p^k \cdot x^1 > w^k
    example: |-
      Suppose bundle $A$ is purchased when $B$ is affordable, and under a different price regime $B$ is purchased when $C$ is affordable.
      Then $A$ is indirectly revealed preferred to $C$.
      SARP dictates that under any budget where $C$ is chosen, bundle $A$ must be strictly unaffordable.
  - id: generalized-axiom-of-revealed-preference
    name: Generalized axiom of revealed preference
    kind: axiom
    section: s03-revealed-preference
    topic: revealed-preference
    gist: A revealed preference axiom stating that if an option is revealed preferred to another, the second cannot be strictly revealed preferred to the first.
    status: proposed
    provenance:
      driver: agent
      agent: antigravity-gemini
      run: fill-s03
    explanation: |-
      The Generalized Axiom of Revealed Preference (GARP) is the exact non-parametric behavioral condition needed to rationalize finite consumption data by utility maximization.
      It posits that whenever bundle $x$ is revealed preferred to bundle $y$ through a chain of pairwise comparisons ($x R y$), bundle $y$ cannot be strictly revealed preferred to $x$ ($y S x$).
      In consumer choice with locally non-satiated preferences, this means that if $x$ is weakly preferred to $y$ through indirect choices, $x$ must not have been strictly affordable when $y$ was purchased ($p^y \cdot x \ge p^y \cdot y$).
      Unlike SARP, GARP accommodates multivalued demand and indifference between distinct bundles.
    citations:
      - source: lecture
        ref: '2026-10-08'
      - source: lecture
        ref: '2026-09-22'
      - source: rubinstein
        ref: Rubenstein_Lecture_Notes_in_Microeconomic_Theory_2026, §The Weak and Strong Axioms of Revealed Preference, p. 85
    formal: |-
      x R y \implies \neg (y S x), \\
      \text{where } R = \text{tr}(R^D) \text{ and } y S x \iff p^y \cdot x < p^y \cdot y \quad (\text{or } x \in A \land x \notin C(A) \text{ while } y \in C(A))
    example: |-
      Suppose observed choices yield $C(\{x, y\}) = \{x\}$ and $C(\{y, z\}) = \{y\}$, establishing that $x$ is revealed preferred to $z$ ($x R z$).
      If a third choice reveals $C(\{x, z\}) = \{z\}$, then $z$ is strictly revealed preferred to $x$ ($z S x$), creating a cycle that directly violates GARP.
  - id: afriats-theorem
    name: Afriat's theorem
    kind: theorem
    section: s03-revealed-preference
    topic: revealed-preference
    gist: A theorem proving the equivalence between GARP, Afriat inequalities, and rationalization by a continuous, concave, monotonic utility function.
    status: proposed
    provenance:
      driver: agent
      agent: antigravity-gemini
      run: fill-s03
    explanation: |-
      Afriat's theorem provides the foundational result in non-parametric demand analysis for discrete price-consumption records $\{(p^i, x^i)\}_{i=1}^I$.
      It shows that an agent's purchases are consistent with optimizing unsatiated preferences if and only if the observations obey the Generalized Axiom of Revealed Preference (GARP).
      This consistency is computationally equivalent to finding strictly positive numbers for utility levels and Lagrange multipliers solving a system of linear constraints known as Afriat inequalities.
      Furthermore, whenever such numbers exist, one can construct an explicit objective function exhibiting continuity, concavity, and monotonicity that fully explains the choices.
      Thus, classical structural assumptions like concavity generate zero testable restrictions beyond GARP in finite empirical samples.
    citations:
      - source: lecture
        ref: '2026-09-22'
    formal: |-
      \text{For data } \{(p^i, x^i)\}_{i=1}^I, \text{ the following are equivalent:} \\
      1.\ \text{The data is rationalized by a locally non-satiated preference relation.} \\
      2.\ \text{The data satisfies GARP: } x^j R x^k \implies \neg (p^k \cdot x^j < p^k \cdot x^k). \\
      3.\ \exists\, \{u^i, \lambda^i > 0\}_{i=1}^I \text{ such that } u^i \le u^j + \lambda^j p^j \cdot (x^i - x^j) \quad \forall i, j. \\
      4.\ \exists \text{ a continuous, concave, strictly monotonic } u \text{ rationalizing the data.}
    example: Given two consumption observations $(p^1, x^1)$ and $(p^2, x^2)$, checking Afriat's conditions reduces to verifying whether expenditure comparisons avoid strict revealed preference cycles, guaranteeing numbers $u^1, u^2$ and multipliers $\lambda^1, \lambda^2 > 0$ that satisfy the subgradient inequalities.
  - id: transitive-closure
    name: Transitive closure
    kind: object
    section: s03-revealed-preference
    topic: revealed-preference
    gist: The minimal transitive relation containing a given binary relation, formed by chains of related elements.
    status: proposed
    provenance:
      driver: agent
      agent: antigravity-gemini
      run: fix-meta
    explanation: |-
      The transitive closure extends an initial binary relation $R$ to ensure transitivity while adding no unnecessary pairs. Two elements are linked in the closure whenever they can be connected through a finite sequence of intermediate steps related under $R$. In order theory and choice modeling, constructing this closure yields the smallest transitive relation that includes the original relation.
    citations:
      - source: ok
        ref: Ok_Real_Analysis_with_Economic_Applications_2026, §DEFINITION, p. 31
    formal: |-
      Let $R$ be a binary relation on a nonempty set $X$. Define $R_0 = R$, and for each integer $m \ge 1$, let $x R_m y$ if there exist $z_1, \dots, z_m \in X$ such that $x R z_1, z_1 R z_2, \dots, z_m R y$. The transitive closure of $R$ is
      \[
      \operatorname{tr}(R) := \bigcup_{m=0}^\infty R_m
      \]
      If $R'$ is any transitive relation on $X$ satisfying $R \subseteq R'$, then $\operatorname{tr}(R) \subseteq R'$.
    example: |-
      Suppose $X = \{x, y, z\}$ and $R = \{(x, y), (y, z)\}$. The relation $R$ is not transitive because $(x, z) \notin R$. Its transitive closure adds this missing link, giving $\operatorname{tr}(R) = \{(x, y), (y, z), (x, z)\}$.
  - id: revealed-preference-relation
    name: Revealed preference relation
    kind: object
    section: s03-revealed-preference
    topic: revealed-preference
    gist: A binary relation inferred from choice behavior where bundle x is revealed preferred to y if x is chosen when y is available.
    status: proposed
    provenance:
      driver: agent
      agent: antigravity-gemini
      run: fill-s03
    explanation: |-
      A revealed preference relation reconstructs a decision-maker's ordering solely from observable market transactions.
      We record that package $x$ dominates $y$ in the direct revealed ordering whenever $x$ is picked in a situation where $y$ could have been purchased within the budget ($p \cdot y \le w$).
      When preferences satisfy monotonicity or local unsatiation and the foregone option $y$ is strictly cheaper than the consumer's expenditure ($p \cdot y < w$), the selected bundle $x$ is deemed strictly superior to $y$.
      By translating tangible price-demand data into pairwise binary comparisons, this concept enables empirical verification of optimizing behavior without positing unobserved psychological utilities.
    citations:
      - source: rubinstein
        ref: Rubenstein_Models_in_Microeconomic_Theory_2023, §The weak axiom of revealed preference, p. 84
      - source: rubinstein
        ref: Rubenstein_Models_in_Microeconomic_Theory_2023, §Definition 5.6 - Revealed preference, p. 85
      - source: rubinstein
        ref: Rubenstein_Lecture_Notes_in_Microeconomic_Theory_2026, §Comment - , p. 85
      - source: lecture
        ref: '2026-09-10'
    formal: |-
      x R^D y \iff \exists (p, w) \text{ such that } x = x(p, w) \text{ and } p \cdot y \le w \\
      x S^D y \iff \exists (p, w) \text{ such that } x = x(p, w) \text{ and } p \cdot y < w
    example: |-
      If a consumer with wealth $w = 20$ faces prices $p = (2, 4)$ and purchases bundle $a = (6, 2)$ costing \$20, bundle $b = (2, 2)$ costs $2(2) + 4(2) = \$12 < 20$.
      Because $b$ was strictly affordable when $a$ was selected, $a$ is strictly revealed preferred to $b$.
  - id: direct-revealed-preference
    name: Direct revealed preference
    kind: object
    section: s03-revealed-preference
    topic: revealed-preference
    gist: Binary relation established when an alternative is selected from a budget set in which another bundle was affordable.
    status: proposed
    provenance:
      driver: agent
      agent: antigravity-gemini
      run: fill-density-20261014
    explanation: Direct revealed preference, denoted $x R^D y$, is an empirical binary relation constructed directly from observed choices. An alternative $x$ is directly revealed preferred to $y$ if $x$ is chosen from a budget environment where $y$ is also feasible. When choices are generated by an underlying preference relation, observing this choice implies that $x$ is weakly preferred to $y$. If the agent's preferences are locally non-satiated, selecting $x$ when $y$ satisfies $p \cdot y \le p \cdot x$ establishes that $y$ cannot be strictly better than $x$.
    citations:
      - source: rubinstein
        ref: Rubenstein_Models_in_Microeconomic_Theory_2023, §Definition 5.6 - Revealed preference, p. 85
      - source: rubinstein
        ref: Rubenstein_Lecture_Notes_in_Microeconomic_Theory_2026, §Comment - , p. 85
    formal: x R^D y \iff \exists (p, w) \text{ such that } x = x(p, w), \, y \in B(p, w) \text{ (i.e., } p \cdot y \leq w = p \cdot x \text{)}
    example: At prices $p = (4, 2)$ and income $w = 20$, a consumer selects bundle $x = (3, 4)$. Because the alternative bundle $y = (2, 5)$ costs $4(2) + 2(5) = 18 \le 20$, bundle $y$ was affordable within the budget set, establishing $x R^D y$.
  - id: indirect-revealed-preference
    name: Indirect revealed preference
    kind: object
    section: s03-revealed-preference
    topic: revealed-preference
    gist: Transitive closure of direct revealed preference, linking alternatives through a finite sequence of pairwise choices.
    status: proposed
    provenance:
      driver: agent
      agent: antigravity-gemini
      run: fill-density-20261014
    explanation: Indirect revealed preference, denoted $x R y$, extends direct revealed preference by imposing transitive consistency across multiple observation periods. A bundle $x$ is indirectly revealed preferred to $y$ if there is a finite chain of intermediate choices connecting $x$ to $y$ through successive direct revealed preference relations. In consumer theory, this transitive closure allows researchers to infer welfare rankings between bundles that were never simultaneously available in any single budget set. It forms the core operational structure required to formulate SARP and Afriat's theorem.
    citations:
      - source: rubinstein
        ref: Rubenstein_Models_in_Microeconomic_Theory_2023, §Definition 1.2 - Transitive binary relation, p. 24
      - source: lecture
        ref: '2026-09-15'
    formal: x R y \iff \exists \{w_k\}_{k=0}^K \text{ with } w_0 = x \text{ and } w_K = y \text{ such that } w_{k-1} R^D w_k \text{ for each } k \in \{1, \dots, K\}
    example: Suppose bundle $x$ is purchased when $y$ is affordable, so $x R^D y$, and in a different price regime bundle $y$ is purchased while $z$ is affordable, giving $y R^D z$. Even if $x$ and $z$ were never compared in the same budget set, the sequence establishes that $x R z$.
  - id: strictly-revealed-preferred
    name: Strictly revealed preferred
    kind: object
    section: s03-revealed-preference
    topic: revealed-preference
    gist: Binary relation arising when a selected alternative is chosen over another strictly affordable, unchosen option.
    status: proposed
    provenance:
      driver: agent
      agent: antigravity-gemini
      run: fill-density-20261014
    explanation: An alternative $x$ is strictly revealed preferred to an alternative $y$, written $x S y$, when $x$ is chosen from a budget environment in which $y$ costs strictly less than the expenditure spent on $x$. Under local non-satiation or monotonicity of consumer tastes, any bundle strictly inside the budget frontier is dominated by an affordable neighboring bundle. Consequently, choosing $x$ while rejecting a strictly cheaper alternative $y$ rules out consumer indifference between them. This relation provides the strict component necessary to test acyclicity and formulate GARP.
    citations:
      - source: rubinstein
        ref: Rubenstein_Lecture_Notes_in_Microeconomic_Theory_2026, §Comment - , p. 85
      - source: rubinstein
        ref: Rubenstein_Models_in_Microeconomic_Theory_2023, §The weak axiom of revealed preference, p. 84
    formal: x S y \iff \exists (p, w) \text{ such that } x = x(p, w) \text{ and } p \cdot y < w = p \cdot x
    example: If prices are $p = (5, 5)$ and the consumer selects $x = (2, 2)$ spending \$20, an alternative bundle $y = (1, 2)$ costing \$15 lies strictly inside the budget frontier. Because $p \cdot y < p \cdot x$, bundle $x$ is strictly revealed preferred to $y$ ($x S y$).
  - id: afriat-inequalities
    name: Afriat inequalities
    kind: definition
    section: s03-revealed-preference
    topic: revealed-preference
    gist: System of linear inequalities in utility levels and Lagrange multipliers characterizing dataset rationalizability.
    status: proposed
    provenance:
      driver: agent
      agent: antigravity-gemini
      run: fill-density-20261014
    explanation: For a finite sequence of price-quantity choices $\{(p^t, x^t)\}_{t=1}^T$, the Afriat inequalities form a solvable linear system in scalar utility values $u_t$ and positive multipliers $\lambda_t$. They represent the discrete first-order and concavity conditions of constrained utility maximization, where each $\lambda_t$ acts as the marginal utility of wealth. Afriat's theorem establishes that this system admits a solution if and only if the consumption data can be rationalized by a continuous, strictly increasing, and concave utility function. Finding a feasible solution allows explicit constructive recovery of a rationalizing piecewise-linear utility function.
    citations:
      - source: rubinstein
        ref: Rubenstein_Lecture_Notes_in_Microeconomic_Theory_2026, §Rationalizing, p. 37
      - source: lecture
        ref: '2026-10-06'
    formal: u_s \leq u_t + \lambda_t p^t \cdot (x^s - x^t) \quad \forall s, t \in \{1, \dots, T\}, \quad \text{with } \lambda_t > 0
    example: Given two choices with $p^1 = (2, 1), x^1 = (3, 4)$ and $p^2 = (1, 2), x^2 = (5, 1)$, cross-expenditure differences are $p^1 \cdot (x^2 - x^1) = 1$ and $p^2 \cdot (x^1 - x^2) = 4$. Assigning utility levels $u_1 = 10, u_2 = 11$ alongside multipliers $\lambda_1 = 2, \lambda_2 = 1$ satisfies $11 \le 10 + 2(1)$ and $10 \le 11 + 1(4)$, solving the Afriat system.
  - id: cyclical-consistency
    name: Cyclical consistency
    kind: axiom
    section: s03-revealed-preference
    topic: revealed-preference
    gist: Revealed preference axiom prohibiting closed preference cycles that contain at least one strict preference comparison.
    status: proposed
    provenance:
      driver: agent
      agent: antigravity-gemini
      run: fill-density-20261014
    explanation: Cyclical consistency requires that no finite sequence of observed choices produces a contradictory preference loop. Whenever an option $x^1$ stands in the revealed preference relation to $x^K$ through a chain of budget comparisons, the consumer cannot simultaneously exhibit that $x^K$ is strictly chosen over $x^1$. While the Weak Axiom of Revealed Preference prevents cycles of length two, cyclical consistency eliminates cycles of arbitrary finite length $K \ge 2$. In empirical consumer analysis, this condition is necessary and sufficient for choice data to be rationalized by an optimizing utility function.
    citations:
      - source: rubinstein
        ref: Rubenstein_Lecture_Notes_in_Microeconomic_Theory_2026, §The Weak and Strong Axioms of Revealed Preference, p. 85
      - source: mwg
        ref: Press_Microeconomic_Theory_2011, §3.J The Strong Axiom of Revealed Preference, p. 102
    formal: x^1 R^D x^2 R^D \dots R^D x^K \implies \neg (x^K S x^1) \quad \text{for any finite sequence } \{x^k\}_{k=1}^K
    example: Suppose bundle $a$ is chosen when $b$ is affordable ($a R^D b$), and $b$ is chosen when $c$ is affordable ($b R^D c$). If the consumer then chooses $c$ while $a$ is strictly cheaper than $c$ ($c S a$), this creates a cycle $a R c$ and $c S a$, violating cyclical consistency.
  - id: homothetic-axiom-of-revealed-preference
    name: Homothetic axiom of revealed preference
    kind: axiom
    section: s03-revealed-preference
    topic: revealed-preference
    gist: Revealed preference axiom characterizing datasets rationalizable by a homothetic and degree-one homogeneous utility function.
    status: proposed
    provenance:
      driver: agent
      agent: antigravity-gemini
      run: fill-density-20261014
    explanation: The Homothetic Axiom of Revealed Preference (HARP) is a non-parametric consistency test that characterizes whether choice data can be rationalized by homothetic preferences. Homothetic preferences possess rays of constant marginal rates of substitution from the origin, ensuring that demand scales linearly with wealth. HARP requires that for any sequence of observed choices, the product of the relative expenditure ratios along any cyclic chain must be at least one. If this condition holds, there exists a continuous, increasing, concave, and homogeneous of degree one utility function rationalizing the observed demand.
    citations:
      - source: rubinstein
        ref: Rubenstein_Lecture_Notes_in_Microeconomic_Theory_2026, §Homothetic Preferences, p. 67
      - source: lecture
        ref: '2026-10-06'
    formal: \prod_{k=1}^K \frac{p^{t_k} \cdot x^{t_{k+1}}}{p^{t_k} \cdot x^{t_k}} \geq 1 \quad \text{for every cyclic index sequence } (t_1, t_2, \dots, t_K, t_{K+1} = t_1)
    example: Consider two observations with $p^1 = (1, 2), x^1 = (2, 1)$ so $p^1 \cdot x^1 = 4$, and $p^2 = (2, 1), x^2 = (1, 2)$ so $p^2 \cdot x^2 = 4$. Evaluating cross expenditures gives $p^1 \cdot x^2 = 5$ and $p^2 \cdot x^1 = 5$. The product of expenditure ratios is $(5/4) \times (5/4) = 25/16 \ge 1$, satisfying HARP.
  - id: houthakkers-axiom
    name: Houthakker's axiom
    kind: axiom
    section: s03-revealed-preference
    topic: revealed-preference
    gist: Revealed preference axiom requiring that indirect revealed preference between distinct bundles is asymmetric, equivalent to SARP.
    status: proposed
    provenance:
      driver: agent
      agent: antigravity-gemini
      run: fill-density-20261014
    explanation: Houthakker's axiom, universally known as the Strong Axiom of Revealed Preference (SARP), provides a necessary and sufficient condition for single-valued demand functions to be rationalized by preferences. It closes the transitivity gap left by Samuelson's Weak Axiom by demanding acyclicity across choice sequences of arbitrary length. Specifically, when bundle $x^1$ links to a distinct bundle $x^K$ via intermediate revealed comparisons, the first bundle $x^1$ must cost strictly more than the budget available at the observation where $x^K$ is chosen. This requirement ensures that the transitive closure of observed pairwise choices is an asymmetric relation that can be extended to a complete preference ranking.
    citations:
      - source: mwg
        ref: Press_Microeconomic_Theory_2011, §3.J The Strong Axiom of Revealed Preference, p. 102
      - source: rubinstein
        ref: Rubenstein_Lecture_Notes_in_Microeconomic_Theory_2026, §The Weak and Strong Axioms of Revealed Preference, p. 85
    formal: \left[ \forall k \in \{1, \dots, K-1\}, \, p^k \cdot x^{k+1} \leq p^k \cdot x^k \text{ with } x^1 \neq x^K \right] \implies p^K \cdot x^1 > p^K \cdot x^K
    example: Suppose $x$ is purchased when $y$ is affordable ($p^x \cdot y \le p^x \cdot x$), and in another period $y$ is purchased when $z$ is affordable ($p^y \cdot z \le p^y \cdot y$) for distinct bundles $x, y, z$. Houthakker's axiom requires that at prices where $z$ is chosen, bundle $x$ must be strictly unaffordable ($p^z \cdot x > p^z \cdot z$).
