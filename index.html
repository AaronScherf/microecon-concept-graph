<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Microeconomics concept graph</title>
<style>:root {
  --bg: #fafaf9; --fg: #1c1917; --muted: #57534e; --line: #d6d3d1; --card: #ffffff;
  --accent: #1d4ed8; --ok: #15803d; --bad: #b91c1c; --warn: #b45309;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1c1917; --fg: #fafaf9; --muted: #a8a29e; --line: #44403c; --card: #292524;
    --accent: #93c5fd; --ok: #4ade80; --bad: #f87171; --warn: #fbbf24;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; }
#top { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 8px 16px; border-bottom: 1px solid var(--line); }
#top h1 { font-size: 1.1rem; margin: 0; flex: 1 1 220px; }
#review-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
#review-bar input { padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--fg); }
button { font: inherit; padding: 4px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--fg); cursor: pointer; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); }
button.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 18%, var(--card)); }
#layout { flex: 1; min-height: 0; display: grid; grid-template-columns: 280px minmax(0, 1fr) 380px; }
#sidebar, #panel { overflow: auto; padding: 12px; background: var(--card); }
#sidebar { border-right: 1px solid var(--line); }
#panel { border-left: 1px solid var(--line); }
#cy { min-width: 0; min-height: 0; overflow: hidden; position: relative; background: var(--bg); }
#search { width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); }
#btn-fit { width: 100%; margin-top: 8px; }
.filters { display: grid; gap: 8px; margin: 10px 0; }
.filters label { display: flex; gap: 6px; align-items: center; color: var(--muted); }
.filters select { flex: 1; padding: 3px; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chips button { font-size: 0.8rem; padding: 2px 8px; }
#name-list h3 { margin: 14px 0 4px; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
#name-list button { display: block; width: 100%; text-align: left; border: none; border-radius: 4px; background: transparent; padding: 3px 6px; }
#name-list button:hover, #name-list button.sel { background: color-mix(in srgb, var(--accent) 16%, var(--card)); }
#name-list .planned { opacity: 0.55; }
#panel h2 { margin: 0 0 4px; font-size: 1.25rem; }
.meta { color: var(--muted); font-size: 0.85rem; margin: 0 0 8px; }
.badge { display: inline-block; padding: 0 6px; border-radius: 10px; border: 1px solid var(--line); font-size: 0.75rem; }
.badge.verified { color: var(--ok); border-color: var(--ok); }
.badge.proposed { color: var(--warn); border-color: var(--warn); }
.badge.flag { color: var(--bad); border-color: var(--bad); }
.field { margin: 12px 0; }
.field h4 { margin: 0 0 2px; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
.field p { margin: 4px 0; }
.field textarea { width: 100%; min-height: 110px; padding: 6px; background: var(--bg); color: var(--fg); border: 1px solid var(--accent); border-radius: 6px; font: inherit; }
.conn { list-style: none; padding: 0; margin: 0; }
.conn li { margin: 4px 0; }
.conn button { text-align: left; width: 100%; }
.actions { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
.cite { color: var(--muted); font-size: 0.85rem; }
math { font-size: 1.05em; }
#toast { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 8px; max-width: 90vw; z-index: 10; }
.hint { color: var(--muted); }
@media (max-width: 1000px) {
  html, body { overflow: auto; height: auto; }
  #layout { display: flex; flex-direction: column; overflow: visible; }
  #sidebar { border-right: none; border-bottom: 1px solid var(--line); max-height: 40vh; }
  #cy { height: 62vh; flex: none; }
  #panel { border-left: none; border-top: 1px solid var(--line); }
}
</style>
</head>
<body>
<header id="top">
  <h1 id="title"></h1>
  <div id="review-bar">
    <label>Your name <input id="reviewer" type="text" autocomplete="name" placeholder="for review credit"></label>
    <span id="decision-count" aria-live="polite">0 decisions</span>
    <button id="btn-submit" type="button">Submit review</button>
    <button id="btn-download" type="button">Download review</button>
    <button id="btn-clear" type="button" title="Forget all my pending decisions">Clear</button>
  </div>
</header>
<main id="layout">
  <aside id="sidebar" aria-label="Browse concepts">
    <input id="search" type="search" placeholder="Search concepts" aria-label="Search concepts">
    <button id="btn-fit" type="button" title="Zoom the graph to fit the window">Fit graph to window</button>
    <div class="filters">
      <div id="f-topics" class="chips" aria-label="Topics"></div>
      <label>Status
        <select id="f-status"><option value="">All</option><option value="verified">Verified</option><option value="proposed">Proposed</option></select>
      </label>
      <label>Kind <select id="f-kind"><option value="">All</option></select></label>
      <div id="f-edges" class="chips" aria-label="Edge types"></div>
    </div>
    <details id="legend"><summary>How to read this</summary><div id="legend-body"></div></details>
    <nav id="name-list" aria-label="Concept list"></nav>
  </aside>
  <div id="cy" role="img" aria-label="Concept graph"></div>
  <section id="panel" aria-live="polite"><p class="hint">Click a concept or a connection to read about it.</p></section>
</main>
<div id="toast" role="status" hidden></div>

14"}, "id": "preorder--has_property--transitivity", "source": "preorder", "status": "proposed", "target": "transitivity", "type": "has_property"}, {"citations": [], "condition": "it is reflexive and transitive", "explanation": "A preorder is a binary relation with two extra properties.", "hashes": {"condition": "46394fbdaa4cfd18", "explanation": "7b0915c4c42a5e03"}, "id": "preorder--is_a--binary-relation", "source": "preorder", "status": "proposed", "target": "binary-relation", "type": "is_a"}, {"citations": [{"ref": "1.D", "source": "mwg"}], "condition": "choices are the most-preferred elements of each menu", "explanation": "Choosing the best element under a rational preference always satisfies the weak axiom.", "hashes": {"condition": "cb9018f6b2e22c5a", "explanation": "c39114f6b0810d34"}, "id": "rational-preference--implies--warp", "source": "rational-preference", "status": "proposed", "target": "warp", "type": "implies"}, {"citations": [], "condition": "it is also complete", "explanation": "A rational preference relation is a complete preorder.", "hashes": {"condition": "75bf6a1593bbf1a5", "explanation": "df6f42b6ac9e26f8"}, "id": "rational-preference--is_a--preorder", "source": "rational-preference", "status": "proposed", "target": "preorder", "type": "is_a"}, {"citations": [], "explanation": "", "hashes": {"condition": "e3b0c44298fc1c14", "explanation": "e3b0c44298fc1c14"}, "id": "sen-alpha--component_of--sen-alpha-beta", "source": "sen-alpha", "status": "proposed", "target": "sen-alpha-beta", "type": "component_of"}, {"citations": [], "condition": "choices are defined on a rich enough family of menus (confirm the exact domain condition in the course notes)", "explanation": "Satisfying both of Sen's conditions is the same as satisfying the weak axiom.", "hashes": {"condition": "368336a9d28c35ef", "explanation": "562ff350b13efd6f"}, "id": "sen-alpha-beta--iff--warp", "source": "sen-alpha-beta", "status": "proposed", "target": "warp", "type": "iff"}, {"citations": [], "explanation": "", "hashes": {"condition": "e3b0c44298fc1c14", "explanation": "e3b0c44298fc1c14"}, "id": "sen-beta--component_of--sen-alpha-beta", "source": "sen-beta", "status": "proposed", "target": "sen-alpha-beta", "type": "component_of"}, {"citations": [], "explanation": "The conclusion is a total order that extends the original.", "hashes": {"condition": "e3b0c44298fc1c14", "explanation": "ad45df0f20148d0c"}, "id": "szpilrajn-extension--yields--total-order", "source": "szpilrajn-extension", "status": "proposed", "target": "total-order", "type": "yields"}, {"citations": [], "explanation": "", "hashes": {"condition": "e3b0c44298fc1c14", "explanation": "e3b0c44298fc1c14"}, "id": "total-order--has_property--completeness", "source": "total-order", "status": "proposed", "target": "completeness", "type": "has_property"}, {"citations": [], "condition": "it is also complete, so every pair is comparable", "explanation": "Adding completeness removes incomparable pairs.", "hashes": {"condition": "cc9192c042b537c1", "explanation": "4495a6e18972b69c"}, "id": "total-order--is_a--partial-order", "source": "total-order", "status": "proposed", "target": "partial-order", "type": "is_a"}, {"citations": [{"ref": "1.D", "source": "mwg"}], "condition": "the family of menus contains every subset of up to three elements", "explanation": "Under that richness condition, weak-axiom behaviour can be rationalized by some rational preference.", "hashes": {"condition": "07543035c552d8ea", "explanation": "db5064de8ded3160"}, "id": "warp--implies--rational-preference", "source": "warp", "status": "proposed", "target": "rational-preference", "type": "implies"}], "graph_version": "76e018266e2c", "nodes": [{"citations": [{"ref": "ch. 2", "source": "rubinstein"}], "explanation": "If two elements are related in both directions they must be the same element. This is what rules out ties\nbetween distinct elements.\n", "formal": "$\\forall x, y:\\ x R y \\wedge y R x \\Rightarrow x = y$.\n", "gist": "Two different elements are never related in both directions.", "hashes": {"example": "e3b0c44298fc1c14", "explanation": "abc0f23eca2afe51", "formal": "999f54c5ab584b11", "gist": "87fd4d93152b9e4a"}, "id": "antisymmetry", "kind": "property", "name": "Antisymmetry", "section": "s01-binary-relations", "status": "proposed", "topic": "order-theory"}, {"citations": [{"ref": "ch. 2", "source": "rubinstein"}], "explanation": "A binary relation $R$ on a set $X$ is a collection of ordered pairs of elements of $X$. Writing $x R y$ means\nthe pair $(x, y)$ is in the collection. Preferences, \"at least as good as\" and \"is a multiple of\" are all\nbinary relations.\n", "formal": "$R \\subseteq X \\times X$.\n", "gist": "A rule that says, for some ordered pairs of elements of a set, that the first is related to the second.", "hashes": {"example": "e3b0c44298fc1c14", "explanation": "18b879d3b47db2a4", "formal": "4c8c68a3e94f4354", "gist": "dce69ccf75f3f9d3"}, "id": "binary-relation", "kind": "object", "name": "Binary relation", "section": "s01-binary-relations", "status": "proposed", "topic": "order-theory"}, {"citations": [{"ref": "ch. 2", "source": "rubinstein"}], "explanation": "For every pair of elements, at least one is related to the other. Nothing is left incomparable.\n", "formal": "$\\forall x, y:\\ x R y \\vee y R x$.\n", "gist": "Any two elements can be compared.", "hashes": {"example": "e3b0c44298fc1c14", "explanation": "c8c7acb3630ba908", "formal": "1c29d59d900d2ca2", "gist": "ebb54f15d10a4076"}, "id": "completeness", "kind": "property", "name": "Completeness", "section": "s01-binary-relations", "status": "proposed", "topic": "order-theory"}, {"citations": [{"ref": "ch. 2", "source": "rubinstein"}], "explanation": "A partial order ranks elements without ties between distinct elements, but may leave some pairs\nincomparable. Divisibility on the positive integers is the standard example.\n", "gist": "A preorder that is also antisymmetric.", "hashes": {"example": "e3b0c44298fc1c14", "explanation": "babafcb8ed28df46", "formal": "e3b0c44298fc1c14", "gist": "baea1b2f76c8a39c"}, "id": "partial-order", "kind": "object", "name": "Partial order", "section": "s01-binary-relations", "status": "proposed", "topic": "order-theory"}, {"citations": [{"ref": "ch. 2", "source": "rubinstein"}], "explanation": "A preorder is the weakest useful notion of ranking: every element ranks with itself and comparisons chain\ntogether, but ties between different elements are allowed and some pairs may be incomparable.\n", "gist": "A binary relation that is reflexive and transitive.", "hashes": {"example": "e3b0c44298fc1c14", "explanation": "43ebb5423f0ab0d1", "formal": "e3b0c44298fc1c14", "gist": "8e7f4b391c09cb45"}, "id": "preorder", "kind": "object", "name": "Preorder", "section": "s01-binary-relations", "status": "proposed", "topic": "order-theory"}, {"citations": [{"ref": "1.B", "source": "mwg"}, {"ref": "ch. 2", "source": "rubinstein"}], "explanation": "A decision maker's preferences are called rational when they are complete (any two alternatives can be\ncompared) and transitive (comparisons chain). Everything in standard consumer theory starts here.\n", "formal": "$\\succsim$ is complete and transitive on $X$.\n", "gist": "A complete and transitive \"at least as good as\" relation.", "hashes": {"example": "e3b0c44298fc1c14", "explanation": "4f07568ec0262984", "formal": "8d55189fbec3c324", "gist": "a5d2ea3c896f83c3"}, "id": "rational-preference", "kind": "object", "name": "Rational preference relation", "section": "s01-binary-relations", "status": "proposed", "topic": "rational-choice"}, {"citations": [{"ref": "ch. 2", "source": "rubinstein"}], "explanation": "A relation is reflexive when every element is related to itself. For \"at least as good as\" this says each\nalternative is at least as good as itself.\n", "formal": "$\\forall x \\in X:\\ x R x$.\n", "gist": "Everything is related to itself.", "hashes": {"example": "e3b0c44298fc1c14", "explanation": "da07b1088dedc158", "formal": "4a5961bda3cf9e53", "gist": "7b0a63799f15fe00"}, "id": "reflexivity", "kind": "property", "name": "Reflexivity", "section": "s01-binary-relations", "status": "proposed", "topic": "order-theory"}, {"citations": [{"ref": "ch. 1", "source": "ok"}], "explanation": "A set is just a collection of distinct things, with no order and no repeats. Alternatives, bundles of goods\nand states of the world are all modelled as elements of some set $X$.\n", "gist": "A collection of distinct objects; the ground floor everything else is built on.", "hashes": {"example": "e3b0c44298fc1c14", "explanation": "fba684f5df410745", "formal": "e3b0c44298fc1c14", "gist": "d02e08e6037577de"}, "id": "set", "kind": "structure", "name": "Set", "section": "s01-binary-relations", "status": "proposed", "topic": "order-theory"}, {"citations": [{"ref": "ch. 1", "source": "ok"}], "explanation": "Given any partial order, one can add comparisons for the incomparable pairs and obtain a total order that\nstill ranks every pair the original already ranked in the same way. For infinite sets the proof needs the\naxiom of choice.\n", "gist": "Every partial order can be completed into a total order without contradicting it.", "hashes": {"example": "e3b0c44298fc1c14", "explanation": "adb849b9e0cbf031", "formal": "e3b0c44298fc1c14", "gist": "4afd997cf789f7f2"}, "id": "szpilrajn-extension", "kind": "theorem", "name": "Szpilrajn extension theorem", "section": "s01-binary-relations", "status": "proposed", "topic": "order-theory"}, {"citations": [{"ref": "ch. 2", "source": "rubinstein"}], "explanation": "A total order lines all the elements up on a single ladder: no ties between distinct elements and no\nincomparable pairs.\n", "gist": "A partial order in which every pair is comparable.", "hashes": {"example": "e3b0c44298fc1c14", "explanation": "43eaf460e62e8f44", "formal": "e3b0c44298fc1c14", "gist": "447ed4d51a5126fe"}, "id": "total-order", "kind": "object", "name": "Total order", "section": "s01-binary-relations", "status": "proposed", "topic": "order-theory"}, {"citations": [{"ref": "ch. 2", "source": "rubinstein"}], "explanation": "Chains of comparisons carry through. If $x$ is at least as good as $y$ and $y$ is at least as good as $z$,\nthen $x$ is at least as good as $z$.\n", "formal": "$\\forall x, y, z:\\ x R y \\wedge y R z \\Rightarrow x R z$.\n", "gist": "If a is related to b and b to c, then a is related to c.", "hashes": {"example": "e3b0c44298fc1c14", "explanation": "cc7a92df451182b8", "formal": "36ec69681de92397", "gist": "8d5e7fd3dab029aa"}, "id": "transitivity", "kind": "property", "name": "Transitivity", "section": "s01-binary-relations", "status": "proposed", "topic": "order-theory"}, {"citations": [{"ref": "1.C", "source": "mwg"}], "explanation": "A choice structure pairs a family of budget sets (the menus that might be offered) with a rule saying which\nelements are chosen from each menu. It describes behaviour directly, without mentioning preferences.\n", "gist": "A family of available sets together with what is chosen from each.", "hashes": {"example": "e3b0c44298fc1c14", "explanation": "f6b5818aa439aa71", "formal": "e3b0c44298fc1c14", "gist": "ab3ad69bb60323e7"}, "id": "choice-structure", "kind": "structure", "name": "Choice structure", "section": "s02-choice", "status": "proposed", "topic": "revealed-preference"}, {"citations": [{"ref": "choice and revealed preference", "source": "lecture"}], "explanation": "If an element is chosen from a menu and it also belongs to a smaller menu inside it, it must be chosen\nfrom the smaller one too. Shrinking the menu cannot make a still-available winner lose.\n", "gist": "Something chosen from a big menu is still chosen from any smaller menu that contains it.", "hashes": {"example": "e3b0c44298fc1c14", "explanation": "77642111889f259b", "formal": "e3b0c44298fc1c14", "gist": "7bcff4674b5d696b"}, "id": "sen-alpha", "kind": "axiom", "name": "Sen's alpha", "section": "s02-choice", "status": "proposed", "topic": "revealed-preference"}, {"citations": [{"ref": "choice and revealed preference", "source": "lecture"}], "explanation": "A bundle node: the choice structure satisfies Sen's alpha and Sen's beta simultaneously. It exists so the\nequivalence with the weak axiom can be drawn as one edge.\n", "gist": "The bundle of both consistency conditions at once.", "hashes": {"example": "e3b0c44298fc1c14", "explanation": "549454016090a3b9", "formal": "e3b0c44298fc1c14", "gist": "54b7a404e25847dc"}, "id": "sen-alpha-beta", "kind": "axiom", "name": "Sen's alpha and beta together", "section": "s02-choice", "status": "proposed", "topic": "revealed-preference"}, {"citations": [{"ref": "choice and revealed preference", "source": "lecture"}], "explanation": "When two elements tie as chosen in a small menu, then in any larger menu that contains it, choosing one of\nthem forces choosing the other as well.\n", "gist": "If two elements are both chosen from a small menu, a bigger menu cannot choose one without the other.", "hashes": {"example": "e3b0c44298fc1c14", "explanation": "3fc88192c1550098", "formal": "e3b0c44298fc1c14", "gist": "21ce149c1e90d6ae"}, "id": "sen-beta", "kind": "axiom", "name": "Sen's beta", "section": "s02-choice", "status": "proposed", "topic": "revealed-preference"}, {"citations": [{"ref": "1.C", "source": "mwg"}], "explanation": "The weak axiom captures \"observed consistent choice behaviour\". If you ever pick $x$ while $y$ was on the\nmenu, you may not pick $y$ without also picking $x$ in another menu where both are available.\n", "gist": "If x is chosen when y is available, then y is never chosen without x being chosen too whenever both are available.", "hashes": {"example": "e3b0c44298fc1c14", "explanation": "d264a35c4f12e3ce", "formal": "e3b0c44298fc1c14", "gist": "8a5686e4c03f3662"}, "id": "warp", "kind": "axiom", "name": "Weak axiom of revealed preference", "section": "s02-choice", "status": "proposed", "topic": "revealed-preference"}, {"citations": [], "explanation": "", "gist": "", "hashes": {"example": "e3b0c44298fc1c14", "explanation": "e3b0c44298fc1c14", "formal": "e3b0c44298fc1c14", "gist": "e3b0c44298fc1c14"}, "id": "walrasian-demand", "kind": "correspondence", "name": "Walrasian demand", "section": "s03-demand", "status": "proposed", "topic": "demand"}], "sections": [{"id": "s01-binary-relations", "lectures": [], "order": 1.0, "state": "taught", "syllabus_ref": null, "title": "Binary relations and orders"}, {"id": "s02-choice", "lectures": [], "order": 2.0, "state": "taught", "syllabus_ref": null, "title": "Choice and revealed preference"}, {"id": "s03-demand", "lectures": [], "order": 3.0, "state": "planned", "syllabus_ref": null, "title": "Consumer demand"}], "site": {"repo": "AaronScherf/microecon-concept-graph", "title": "Microeconomics concept graph"}, "vocab": {"kinds": ["object", "structure", "property", "axiom", "definition", "theorem", "lemma", "model", "function", "correspondence", "identity", "technique", "example"], "topics": ["order-theory", "rational-choice", "revealed-preference", "demand"]}}</script>

      { selector: "node.hidden, edge.hidden", style: { display: "none" } },
      { selector: "node:selected", style: { "border-width": 4, "border-color": "#f59e0b", "border-style": "solid" } },
      { selector: "edge", style: { width: 2, "curve-style": "bezier", "line-color": "data(color)", "target-arrow-color": "data(color)", "target-arrow-shape": "data(arrow)", "arrow-scale": 1.2 } },
      { selector: "edge[status = 'proposed']", style: { "line-style": "dashed" } },
      { selector: "edge[type = 'iff']", style: { "source-arrow-shape": "triangle", "source-arrow-color": "data(color)" } },
      { selector: "edge.accepted", style: { width: 4 } },
      { selector: "edge.labelled", style: { label: "data(label)", "font-size": 11, color: "#111", "text-background-color": "#fff", "text-background-opacity": 0.92, "text-background-padding": 2, "text-rotation": "autorotate" } },
      { selector: "edge:selected", style: { width: 4, "line-color": "#f59e0b", "target-arrow-color": "#f59e0b" } }
    ]
  });
  cy.fit(undefined, 30);

  function paintDecisions() {
    cy.elements().removeClass("accepted rejected");
    decisions.forEach(function (d) {
      var el = cy.getElementById(d.target.id);
      if (!el.nonempty()) return;
      if (d.action === "accept") el.addClass("accepted");
      if (d.action === "reject") el.addClass("rejected");
    });
  }

  function applyFilters() {
    var visible = new Set(CG.filterNodes(G.nodes, filters).map(function (n) { return n.id; }));
    cy.nodes().forEach(function (n) { n.toggleClass("hidden", !visible.has(n.id())); });
    cy.edges().forEach(function (e) {
      var hide = hiddenEdgeTypes.has(e.data("type")) || !visible.has(e.data("source")) || !visible.has(e.data("target"));
      e.toggleClass("hidden", hide);
    });
    renderNameList(visible);
  }

  function applyPrereqMode() {
    cy.elements().removeClass("faded");
    if (!prereqMode || !selected || selected.kind !== "node") return;
    var keep = CG.prerequisites(selected.id, G.edges);
    keep.add(selected.id);
    cy.nodes().forEach(function (n) { if (!keep.has(n.id())) n.addClass("faded"); });
    cy.edges().forEach(function (e) { if (!(keep.has(e.data("source")) && keep.has(e.data("target")))) e.addClass("faded"); });
  }

  function select(kind, id, focus) {
    selected = { kind: kind, id: id }; editing = null;
    cy.elements().unselect();
    cy.edges().removeClass("labelled");
    var el = cy.getElementById(id);
    if (el.nonempty()) {
      el.select();
      if (kind === "node") el.connectedEdges().addClass("labelled");
      else el.addClass("labelled");
      if (focus) cy.animate({ center: { eles: el }, duration: 250 });
    }
    applyPrereqMode(); renderPanel(); renderNameList();
  }
  cy.on("tap", "node", function (ev) { select("node", ev.target.id(), false); });
  cy.on("tap", "edge", function (ev) { select("edge", ev.target.id(), false); });
  cy.on("tap", function (ev) { if (ev.target === cy) { selected = null; cy.elements().unselect(); cy.edges().removeClass("labelled"); applyPrereqMode(); renderPanel(); renderNameList(); } });

  // ---- sidebar --------------------------------------------------------------
  function renderNameList(visibleSet) {
    var visible = visibleSet || new Set(CG.filterNodes(G.nodes, filters).map(function (n) { return n.id; }));
    var html = "";
    G.sections.slice().sort(function (a, b) { return a.order - b.order; }).forEach(function (s) {
      var list = G.nodes.filter(function (n) { return n.section === s.id && visible.has(n.id); })
        .sort(function (a, b) { return a.name.localeCompare(b.name); });
      if (!list.length) return;
      html += "<h3>" + esc(s.title) + (s.state === "planned" ? " (planned)" : "") + "</h3>";
      list.forEach(function (n) {
        var cls = (s.state === "planned" ? "planned " : "") + (selected && selected.id === n.id ? "sel" : "");
        html += '<button type="button" class="' + cls + '" data-node="' + esc(n.id) + '">' + esc(n.name) + "</button>";
      });
    });
    $("#name-list").innerHTML = html || '<p class="hint">No concepts match.</p>';
  }
  $("#name-list").addEventListener("click", function (ev) {
    var b = ev.target.closest("button[data-node]");
    if (b) select("node", b.getAttribute("data-node"), true);
  });

  function buildFilters() {
    var topics = $("#f-topics");
    topics.innerHTML = G.vocab.topics.map(function (t) { return '<button type="button" data-topic="' + esc(t) + '">' + esc(t) + "</button>"; }).join("");
    topics.addEventListener("click", function (ev) {
      var b = ev.target.closest("button[data-topic]"); if (!b) return;
      var t = b.getAttribute("data-topic"), i = filters.topics.indexOf(t);
      if (i === -1) filters.topics.push(t); else filters.topics.splice(i, 1);
      b.classList.toggle("on", i === -1); applyFilters();
    });
    var kinds = Array.from(new Set(G.nodes.map(function (n) { return n.kind; }))).sort();
    $("#f-kind").insertAdjacentHTML("beforeend", kinds.map(function (k) { return '<option value="' + esc(k) + '">' + esc(k) + "</option>"; }).join(""));
    $("#f-kind").addEventListener("change", function (ev) { filters.kinds = ev.target.value ? [ev.target.value] : []; applyFilters(); });
    $("#f-status").addEventListener("change", function (ev) { filters.statuses = ev.target.value ? [ev.target.value] : []; applyFilters(); });
    $("#search").addEventListener("input", function (ev) { filters.q = ev.target.value; applyFilters(); });
    var used = Array.from(new Set(G.edges.map(function (e) { return e.type; })));
    $("#f-edges").innerHTML = used.map(function (t) { return '<button type="button" class="on" data-etype="' + t + '">' + esc(EDGE_STYLE[t].label) + "</button>"; }).join("");
    $("#f-edges").addEventListener("click", function (ev) {
      var b = ev.target.closest("button[data-etype]"); if (!b) return;
      var t = b.getAttribute("data-etype");
      if (hiddenEdgeTypes.has(t)) hiddenEdgeTypes.delete(t); else hiddenEdgeTypes.add(t);
      b.classList.toggle("on", !hiddenEdgeTypes.has(t)); applyFilters();
    });
    $("#legend-body").innerHTML =
      "<p>Boxes are concepts, coloured by topic; higher on the page means later in the course. A dashed outline means not yet reviewed. Faded boxes are in sections not taught yet.</p>" +
      "<p>Arrows read as sentences: select a concept to see every connection written out.</p><ul>" +
      Object.keys(EDGE_STYLE).map(function (t) { return '<li><span style="color:' + EDGE_STYLE[t].color + '">&#9632;</span> ' + esc(EDGE_STYLE[t].label) + "</li>"; }).join("") + "</ul>";
  }

  // ---- detail panel ---------------------------------------------------------
  function fieldBlock(kind, id, field, label) {
    var it = item(kind, id);
    var value = effective(kind, id, field);
    if (!value && editing !== field) {
      return '<div class="field"><h4>' + label + '<button type="button" data-act="edit" data-field="' + field + '">Add</button></h4></div>';
    }
    if (editing === field) {
      return '<div class="field"><h4>' + label + '</h4><textarea id="edit-box">' + esc(value || "") + '</textarea>' +
        '<div class="actions"><button type="button" class="primary" data-act="save-edit" data-field="' + field + '">Save edit</button>' +
        '<button type="button" data-act="cancel-edit">Cancel</button></div></div>';
    }
    var edited = decisionsFor(kind, id).some(function (d) { return d.action === "edit" && d.field === field; });
    return '<div class="field"><h4>' + label + (edited ? ' <span class="badge proposed">edited</span>' : "") +
      '<button type="button" data-act="edit" data-field="' + field + '">Edit</button></h4>' + rich(value) + "</div>";
  }
  function citations(it) {
    if (!it.citations || !it.citations.length) return "";
    return '<div class="field"><h4>Sources</h4><p class="cite">' + it.citations.map(function (c) { return esc(c.source + " " + c.ref); }).join(" &middot; ") + "</p></div>";
  }
  function criticBadge(it) {
    return it.critic && it.critic.verdict !== "supports"
      ? ' <span class="badge flag" title="' + esc(it.critic.note || "") + '">check: ' + esc(it.critic.verdict) + "</span>" : "";
  }
  function reviewControls(kind, id, it) {
    var mine = decisionsFor(kind, id);
    var acc = mine.some(function (d) { return d.action === "accept"; });
    var rej = mine.some(function (d) { return d.action === "reject"; });
    var cm = mine.filter(function (d) { return d.action === "comment"; })[0];
    return '<div class="field"><h4>Your review</h4><div class="actions">' +
      (it.status === "proposed" ? '<button type="button" class="' + (acc ? "on" : "") + '" data-act="accept">Accept</button>' +
        '<button type="button" class="' + (rej ? "on" : "") + '" data-act="reject">Reject</button>' : "") +
      "</div><textarea id=\"comment-box\" placeholder=\"Optional comment for the maintainer\" rows=\"2\" style=\"width:100%\">" + esc(cm ? cm.comment : "") + "</textarea>" +
      '<div class="actions"><button type="button" data-act="comment">Save comment</button></div></div>';
  }
  function renderPanel() {
    var p = $("#panel");
    if (!selected) { p.innerHTML = '<p class="hint">Click a concept or a connection to read about it.</p>'; return; }
    if (selected.kind === "node") return renderNode(p);
    return renderEdge(p);
  }
  function renderNode(p) {
    var n = nodesById.get(selected.id), sec = sectionsById.get(n.section);
    var conns = G.edges.filter(function (e) { return e.source === n.id || e.target === n.id || e.via === n.id; });
    p.innerHTML =
      "<h2>" + esc(n.name) + "</h2>" +
      '<p class="meta">' + esc(n.kind) + " &middot; " + esc(n.topic) + " &middot; " + esc(sec ? sec.title : n.section) +
      ' <span class="badge ' + n.status + '">' + n.status + "</span>" + criticBadge(n) + "</p>" +
      fieldBlock("node", n.id, "gist", "Summary") +
      '<div class="actions"><button type="button" class="' + (prereqMode ? "on" : "") + '" data-act="prereq">Show what this needs</button></div>' +
      fieldBlock("node", n.id, "explanation", "Explanation") +
      fieldBlock("node", n.id, "formal", "Formal statement") +
      fieldBlock("node", n.id, "example", "Example") +
      citations(n) +
      '<div class="field"><h4>Connections</h4><ul class="conn">' +
      (conns.map(function (e) { return '<li><button type="button" data-edge="' + esc(e.id) + '">' + esc(CG.edgeSentence(e, nameOf)) + "</button></li>"; }).join("") || "<li class=\"hint\">None yet.</li>") +
      "</ul></div>" + reviewControls("node", n.id, n);
  }
  function renderEdge(p) {
    var e = edgesById.get(selected.id);
    p.innerHTML =
      "<h2>" + esc(CG.edgeSentence(e, nameOf)) + "</h2>" +
      '<p class="meta">' + esc(EDGE_STYLE[e.type].label) + ' <span class="badge ' + e.status + '">' + e.status + "</span>" + criticBadge(e) + "</p>" +
      fieldBlock("edge", e.id, "condition", "Condition") +
      fieldBlock("edge", e.id, "explanation", "Why") +
      citations(e) +
      '<div class="actions"><button type="button" data-node="' + esc(e.source) + '">Go to ' + esc(nameOf(e.source)) + '</button>' +
      '<button type="button" data-node="' + esc(e.target) + '">Go to ' + esc(nameOf(e.target)) + "</button></div>" +
      reviewControls("edge", e.id, e);
  }

  $("#panel").addEventListener("click", function (ev) {
    var b = ev.target.closest("button"); if (!b) return;
    if (b.hasAttribute("data-edge")) return select("edge", b.getAttribute("data-edge"), true);
    if (b.hasAttribute("data-node")) return select("node", b.getAttribute("data-node"), true);
    var act = b.getAttribute("data-act"); if (!act || !selected) return;
    var kind = selected.kind, id = selected.id, field = b.getAttribute("data-field");
    if (act === "accept" || act === "reject") {
      var already = decisionsFor(kind, id).some(function (d) { return d.action === act; });
      return already ? undecide(kind, id, act) : decide(kind, id, act);
    }
    if (act === "prereq") { prereqMode = !prereqMode; applyPrereqMode(); return renderPanel(); }
    if (act === "edit") { editing = field; return renderPanel(); }
    if (act === "cancel-edit") { editing = null; return renderPanel(); }
    if (act === "save-edit") {
      var text = $("#edit-box").value;
      editing = null;
      return decide(kind, id, "edit", { field: field, base_hash: item(kind, id).hashes[field], new_value: text });
    }
    if (act === "comment") {
      var c = $("#comment-box").value.trim();
      return c ? decide(kind, id, "comment", { comment: c }) : undecide(kind, id, "comment");
    }
  });

  // ---- header: submit / download / clear -------------------------------------
  function needName() {
    if (reviewer.trim()) return true;
    $("#reviewer").focus(); toast("Please type your name first so your review can be credited.");
    return false;
  }
  function currentReview() { return CG.buildReview(G, decisions, reviewer.trim(), new Date().toISOString()); }
  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).then(function () { return true; }, function () { return false; });
    }
    try {
      var ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select();
      var ok = document.execCommand("copy"); document.body.removeChild(ta); return Promise.resolve(ok);
    } catch (e) { return Promise.resolve(false); }
  }
  function download() {
    if (!needName() || !decisions.length) { if (!decisions.length) toast("Nothing to download yet: accept, reject, edit or comment first."); return; }
    var text = JSON.stringify(currentReview(), null, 2);
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([text], { type: "application/json" }));
    a.download = "review-" + reviewer.trim().toLowerCase().replace(/[^a-z0-9]+/g, "-") + "-" + new Date().toISOString().slice(0, 10) + ".json";
    document.body.appendChild(a); a.click(); a.remove();
  }
  function submit() {
    if (!needName()) return;
    if (!decisions.length) return toast("Nothing to submit yet: accept, reject, edit or comment first.");
    var review = currentReview();
    var text = JSON.stringify(review, null, 2);
    var repo = G.site && G.site.repo;
    if (!repo) return toast("No GitHub repository is configured for this graph. Use Download review and send the file to the maintainer.");
    var res = CG.issueUrl(repo, review);
    copyText(text).then(function (copied) {
      window.open(res.url, "_blank", "noopener");
      toast(res.prefilled ? "A GitHub issue form opened with your review filled in. Press Submit new issue there."
        : copied ? "Your review is copied. Paste it into the box on the GitHub page that opened, then press Submit new issue."
          : "Could not copy automatically. Use Download review and attach the file to the GitHub issue.");
    });
  }
  $("#btn-submit").addEventListener("click", submit);
  $("#btn-download").addEventListener("click", download);
  $("#btn-clear").addEventListener("click", function () {
    if (decisions.length && !window.confirm("Forget all " + decisions.length + " pending decisions?")) return;
    decisions = []; persist(); paintDecisions(); renderPanel();
  });
  $("#reviewer").value = reviewer;
  $("#reviewer").addEventListener("input", function (ev) { reviewer = ev.target.value; storage.set("cg-reviewer", reviewer); });

  // ---- start ----------------------------------------------------------------
  $("#title").textContent = (G.site && G.site.title) || "Concept graph";
  buildFilters(); persist(); paintDecisions(); applyFilters();
  // Keep the whole graph in view until the reader moves it themselves: the window may still be settling
  // to its final size when the page first draws, and a phone can rotate.
  var touched = false;
  ["wheel", "mousedown", "touchstart"].forEach(function (name) {
    $("#cy").addEventListener(name, function () { touched = true; }, { passive: true });
  });
  function refit() { cy.resize(); if (!touched) cy.fit(undefined, 30); }
  window.addEventListener("resize", refit);
  window.addEventListener("load", refit);
  $("#btn-fit").addEventListener("click", function () { touched = false; refit(); });
})();
</script>
</body>
</html>
